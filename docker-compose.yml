services:
  backend:
    build:
      context: ./backend
    container_name: barinda-portfolio-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_IN_PRODUCTION"
      Admin__Username: "admin"
      Admin__Password: "CHANGE_THIS_PASSWORD"
    volumes:
      - ./backend/data:/app/data
